<!DOCTYPE html>
<html lang="en">
<head>

    <title>REGISTRATION Form</title>

        body {
            border: 3px solid black;

            margin-left: 500px;

        }
        .one {
            background-color: rgb(176, 176, 176);
            padding: 20px;
        }
        
        p {
            font-size: 33px;
            color: rgb(0, 0, 0);

        }

            text-align: center;
        }
    </style>
</head>
<body style="background-color: rgb(135, 131, 125);">
    <form class="one">
        <p>REGISTRATION FORM</p>

        First Name: <input type="text" placeholder=""><br><br>

        <textarea rows="4" cols="40"></textarea><br><br>

    </form>
