<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Registration Form</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #eef1f8;
    --card: #ffffff;
    --ink: #1c2233;
    --muted: #667089;
    --line: #d7dcea;
    --brand: #3b4cca;
    --brand-dark: #2c3aa3;
    --panel: #1f2a6b;
    --focus: rgba(59, 76, 202, .25);
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    font-family: Inter, system-ui, sans-serif;
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px 16px;
  }
  .wrap {
    width: 100%;
    max-width: 960px;
    display: grid;
    grid-template-columns: 5fr 7fr;
    background: var(--card);
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 20px 50px rgba(31, 42, 107, .15);
  }
  .side {
    background: linear-gradient(160deg, var(--panel), var(--brand));
    color: #fff;
    padding: 48px 36px;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
  }
  .side h1 {
    font-family: Fraunces, Georgia, serif;
    font-size: 2.4rem;
    line-height: 1.1;
    margin-bottom: 14px;
  }
  .side p { color: #d5daf7; line-height: 1.6; max-width: 32ch; }
  form { padding: 40px 40px 36px; }
  form h2 { font-size: 1.25rem; margin-bottom: 4px; }
  .sub-text { color: var(--muted); font-size: .9rem; margin-bottom: 24px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }
  .full { grid-column: 1 / -1; }
  label, legend { font-size: .85rem; font-weight: 600; }
  input[type="text"], input[type="email"], input[type="password"],
  input[type="tel"], input[type="date"], textarea {
    width: 100%;
    font: inherit;
    padding: 11px 13px;
    border: 1.5px solid var(--line);
    border-radius: 10px;
    background: #fafbfe;
    color: var(--ink);
    transition: border-color .15s, box-shadow .15s;
  }
  textarea { resize: vertical; min-height: 96px; }
  input:focus, textarea:focus {
    outline: none;
    border-color: var(--brand);
    box-shadow: 0 0 0 4px var(--focus);
    background: #fff;
  }
  fieldset { border: 0; padding: 0; margin-bottom: 16px; }
  .radios { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 8px; }
  .radios label {
    font-weight: 500;
    cursor: pointer;
  }
  .radios input { position: absolute; opacity: 0; }
  .radios span {
    display: inline-block;
    padding: 9px 18px;
    border: 1.5px solid var(--line);
    border-radius: 999px;
    font-size: .9rem;
    transition: all .15s;
  }
  .radios input:checked + span {
    background: var(--brand);
    border-color: var(--brand);
    color: #fff;
  }
  .radios input:focus-visible + span { box-shadow: 0 0 0 4px var(--focus); }
  button {
    width: 100%;
    font: inherit;
    font-weight: 600;
    padding: 14px;
    border: 0;
    border-radius: 10px;
    background: var(--brand);
    color: #fff;
    cursor: pointer;
    margin-top: 8px;
    transition: background .15s, transform .1s;
  }
  button:hover { background: var(--brand-dark); }
  button:active { transform: scale(.99); }
  button:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  .done {
    display: none;
    margin-top: 14px;
    padding: 12px 14px;
    background: #e5f6ec;
    color: #17623a;
    border-radius: 10px;
    font-size: .9rem;
  }
 
  @media (max-width: 760px) {
    .wrap { grid-template-columns: 1fr; }
    .side { padding: 28px 24px; }
    .side h1 { font-size: 1.8rem; }
    form { padding: 28px 22px; }
  }
  @media (max-width: 460px) {
    .grid { grid-template-columns: 1fr; gap: 0; }
  }
</style>
</head>
<body>
  <main class="wrap">
    <section class="side">
      <h1>Create your account</h1>
      <p>Fill in your details to get started. It takes less than a minute.</p>
    </section>
 
    <form id="reg" novalidate>
      <h2>Registration form</h2>
      <p class="sub-text">Fields marked * are required.</p>
 
      <div class="grid">
        <div class="field">
          <label for="fn">First name *</label>
          <input id="fn" type="text" required autocomplete="given-name">
        </div>
        <div class="field">
          <label for="mn">Middle name</label>
          <input id="mn" type="text" autocomplete="additional-name">
        </div>
        <div class="field full">
          <label for="ln">Last name *</label>
          <input id="ln" type="text" required autocomplete="family-name">
        </div>
        <div class="field full">
          <label for="em">Email *</label>
          <input id="em" type="email" required autocomplete="email">
        </div>
        <div class="field full">
          <label for="pw">Password *</label>
          <input id="pw" type="password" required minlength="8" autocomplete="new-password">
        </div>
      </div>
 
      <fieldset>
        <legend>Gender</legend>
        <div class="radios">
          <label><input type="radio" name="gender" value="male"><span>Male</span></label>
          <label><input type="radio" name="gender" value="female"><span>Female</span></label>
          <label><input type="radio" name="gender" value="other"><span>Other</span></label>
        </div>
      </fieldset>
 
      <div class="grid">
        <div class="field">
          <label for="mob">Mobile number</label>
          <input id="mob" type="tel" inputmode="numeric" autocomplete="tel">
        </div>
        <div class="field">
          <label for="dob">Date of birth</label>
          <input id="dob" type="date">
        </div>
        <div class="field full">
          <label for="msg">Comments</label>
          <textarea id="msg"></textarea>
        </div>
      </div>
 
      <button type="submit">Create account</button>
      <div class="done" id="done" role="status">Account created. Welcome aboard!</div>
    </form>
  </main>
 
  <script>
    const form = document.getElementById('reg');
    form.addEventListener('submit', e => {
      e.preventDefault();
      if (!form.checkValidity()) { form.reportValidity(); return; }
      document.getElementById('done').style.display = 'block';
      form.reset();
    });
  </script>
</body>
</html>
